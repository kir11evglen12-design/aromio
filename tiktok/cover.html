<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AROMIO — обложка 1500×1500</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#05080d;overflow:hidden}
  canvas{display:block;width:1500px;height:1500px}
</style>
</head>
<body>
<canvas id="c" width="1500" height="1500"></canvas>
<script src="scene.js"></script>
<script>
window.__ready=false;
document.fonts.ready.then(async()=>{
  await document.fonts.load('400 40px Inter');
  await document.fonts.load('300 160px Cormorant');
  AROMIO.bind('c'); AROMIO.renderCover();
  window.__ready=true;
});
</script>
</body>
</html>
