етёт в Грассе всего три недели в мае. Из четырёхсот килограммов лепестков получается один килограмм абсолюта.`},{match:/уд|агарвуд/i,title:`Уд`,fact:`Смола появляется только когда агаровое дерево заражается плесенью — в природе это происходит меньше чем с двумя процентами деревьев. Отсюда цена, сравнимая с ценой золота по весу.`},{match:/амбр|амброксан/i,title:`Амбра`,fact:`Природная амбра вызревает в океане годами после того, как её исторгает кашалот. Сегодня почти вся парфюмерия использует амброксан — молекулу с тем же тёплым минеральным следом.`},{match:/бергамот/i,title:`Бергамот`,fact:`Почти весь парфюмерный бергамот растёт на узкой полосе побережья Калабрии. Масло выжимают из кожуры холодным прессом — нагрев убивает верхнюю искру.`},{match:/ванил/i,title:`Ваниль`,fact:`Единственная орхидея, дающая съедобный плод. Вне Мексики её опыляют вручную — приём придумал двенадцатилетний Эдмон Альбиус в 1841 году, и им пользуются до сих пор.`},{match:/сандал/i,title:`Сандал`,fact:`Ядровая древесина набирает масло пятнадцать–тридцать лет. Индийский сандал взят под охрану, поэтому дома всё чаще берут австралийский Santalum spicatum.`},{match:/мускус/i,title:`Белый мускус`,fact:`Настоящий мускус кабарги запрещён конвенцией СITES с 1979 года. «Белый мускус» сегодня — семейство синтетических молекул, чистых и почти бельевых по запаху.`},{match:/пачул/i,title:`Пачули`,fact:`Листья сначала ферментируют и только потом перегоняют. Масло — редкий случай в парфюмерии — с годами не портится, а становится глубже.`},{match:/лаванд/i,title:`Лаванда`,fact:`Ценится высокогорная Lavandula angustifolia: чем выше плантация в Провансе, тем меньше камфоры и тоньше запах.`},{match:/ветивер/i,title:`Ветивер`,fact:`Работают не с листьями, а с корнями — их выкапывают минимум через полтора года, моют и сушат. Гаитянский ветивер мягче и дымнее явского.`},{match:/кофе/i,title:`Кофе`,fact:`В парфюмерии почти не используют экстракт зёрен: он темнеет и мутнеет. Аромат собирают из отдельных молекул обжарки.`},{match:/корица/i,title:`Корица`,fact:`В дело идёт внутренний слой коры коричного дерева — его снимают в сезон дождей, когда кора отходит целым листом.`},{match:/кокос/i,title:`Кокос`,fact:`Узнаваемую «кокосовую» сладость даёт гамма-лактон, которого в самом орехе почти нет — его вкус мы знаем скорее по солнцезащитным кремам.`},{match:/лимон|мандарин|цитрус/i,title:`Цитрусы`,fact:`Цитрусовые масла держатся считаные минуты — поэтому их задача не звучать долго, а открыть аромат и передать его сердцу.`},{match:/грейпфрут/i,title:`Грейпфрут`,fact:`За горьковатую свежесть отвечает нооткатон — молекула, которой в плоде тысячные доли процента.`},{match:/ирис/i,title:`Ирис`,fact:`Самое дорогое сырьё после уда: корневища сушат три года, прежде чем в них появится пудровый запах фиалки.`},{match:/кож/i,title:`Кожа`,fact:`Кожаный аккорд достался парфюмерии от перчаточников Грасса: они отбивали запах дубления цветочными настоями — так город и стал парфюмерной столицей.`},{match:/ладан/i,title:`Ладан`,fact:`Смолу собирают, надрезая ствол босвеллии и оставляя её застывать на воздухе — способ не менялся несколько тысяч лет.`},{match:/шафран/i,title:`Шафран`,fact:`Три рыльца на цветок, ручной сбор — на килограмм пряности уходит около ста пятидесяти тысяч цветков.`}],Ql=e=>Zl.find(t=>t.match.test(e)),$l={1:{year:`2015`,nose:`Франсуа Демаши`,text:`Демаши искал запах открытого пространства и поехал за ним в пустыню — отсюда минеральная сухость и раскалённый цитрус, ставшие приметой десятилетия.`},2:{year:`2011`,text:`Ирис — самое дорогое цветочное сырьё в парфюмерии: корневища сушат три года. Здесь он звучит пудрово и по-мужски сдержанно.`},3:{year:`1947`,text:`Первый аромат дома вышел в один день с коллекцией New Look. Название — в честь сестры Кристиана Диора Катрин, участницы Сопротивления: она вошла в комнату, и кто-то сказал «Вот и мисс Диор».`},4:{year:`1999`,nose:`Калис Беккер`,text:`Задача звучала как «цветочный абсолют без единого острого угла». Беккер собрала букет, в котором ни один цветок не выступает вперёд — приём, который потом копировали двадцать лет.`},5:{year:`2021`,nose:`Жак Кавалье-Беллетрю`,text:`Пять цитрусов и чай вместо привычной древесной базы: аромат построен так, чтобы оставаться прозрачным даже в жару.`},6:{year:`2018`,nose:`Жак Кавалье-Беллетрю`,text:`Первый уд дома и до сих пор его самый плотный аромат. Создан после поездки на Ближний Восток — там уд жгут как приветствие гостю.`},7:{year:`2018`,nose:`Жак Кавалье-Беллетрю`,text:`Название переводится как «ловец снов». Пион здесь не сладкий, а почти водянистый — за счёт личи, которое обычно боятся ставить в сердце.`},8:{year:`2020`,nose:`Жак Кавалье-Беллетрю`,text:`Аромат про холод высоты: цитрус с мятой держат прохладу первые полчаса, и только потом проступает древесная база.`},9:{year:`2019`,text:`Дом переехал в Рим в 1960-м, и линия названа в честь города. Шипы на крышке — те самые студы Валентино, придуманные для обуви ещё в шестидесятых.`},10:{year:`2014`,text:`Джандуйя — туринская паста из фундука и шоколада, придуманная во время наполеоновской блокады, когда какао не хватало. Она и дала аромату гурманскую сердцевину.`},11:{year:`2022`,text:`Зелёная версия Born In Roma: тот же костяк, но верх переписан на зелёное яблоко и бергамот — редкий случай, когда флакон меняет цвет вместе с формулой.`},12:{year:`2020`,text:`Аромат делали как манифест о праве говорить в полный голос — отсюда имя: «живой голос».`}},eu={DIOR:{founded:`1946`,place:`Париж`,text:`Кристиан Диор выпустил первый аромат раньше, чем первую прибыль: Miss Dior представили вместе с дебютной коллекцией 1947 года. С тех пор парфюмерия у дома идёт наравне с кутюром, а не следом за ним.`},"LOUIS VUITTON":{founded:`1854`,place:`Париж — Грасс`,text:`Дом начинался с сундуков и почти сто лет обходился без парфюмерии. Линию возродили только в 2016-м, выкупив усадьбу Les Fontaines Parfumées в Грассе и позвав парфюмера Жака Кавалье-Беллетрю.`},VALENTINO:{founded:`1960`,place:`Рим`,text:`Валентино Гаравани открыл ателье на виа Кондотти и сделал Рим своей подписью — от красного «россо Валентино» до металлических шипов, которые сегодня узнаются на крышке флакона.`}};function tu(){let{setCategory:e,openProduct:t}=oe(),n=qc(()=>{Jc(`.house-row`,{y:26,stagger:.08})},[]);return(0,P.jsxs)(`section`,{className:`section`,id:`lines`,ref:n,children:[(0,P.jsxs)(`div`,{className:`section-head`,children:[(0,P.jsxs)(`div`,{children:[(0,P.jsx)(`div`,{className:`eyebrow`,children:`Дома`}),(0,P.jsxs)(`h2`,{className:`display`,children:[`Три дома`,(0,P.jsx)(`br`,{}),(0,P.jsx)(`em`,{children:`в витрине`})]})]}),(0,P.jsx)(`p`,{className:`lead`,children:`Пока мы держим только то, что знаем досконально: Dior, Louis Vuitton и Valentino. Каждый аромат — с полной пирамидой нот.`})]}),(0,P.jsx)(`div`,{className:`houses-list`,children:h.map(n=>{let r=y(n);return(0,P.jsxs)(`div`,{className:`house-row`,children:[(0,P.jsxs)(`div`,{className:`house-side`,children:[(0,P.jsxs)(`button`,{className:`house-title`,onClick:()=>{e(n),Nl(`collection`)},children:[(0,P.jsx)(`b`,{children:n}),(0,P.jsxs)(`span`,{children:[eu[n].founded,` — `,eu[n].place,` — `,r.length,` ароматов`]})]}),(0,P.jsx)(`p`,{className:`house-story`,children:eu[n].text})]}),(0,P.jsx)(`div`,{className:`house-items`,children:r.map(e=>(0,P.jsxs)(`button`,{className:`house-item`,onClick:()=>t(e.id),children:[(0,P.jsx)(`span`,{children:e.name}),(0,P.jsxs)(`i`,{children:[`от `,b(x(e))]})]},e.id))})]},n)})})]})}function nu(){let{setCategory:e}=oe(),t=t=>{e(t),Nl(`collection`)};return(0,P.jsxs)(`footer`,{className:`footer`,children:[(0,P.jsxs)(`div`,{className:`footer-top`,children:[(0,P.jsx)(`div`,{className:`footer-word`,children:`AROMIO`}),(0,P.jsxs)(`div`,{className:`footer-cols`,children:[(0,P.jsxs)(`div`,{className:`footer-col`,children:[(0,P.jsx)(`h4`,{children:`Навигация`}),(0,P.jsx)(`button`,{className:`link-u`,onClick:()=>t(`all`),children:`Каталог`}),(0,P.jsx)(`button`,{className:`link-u`,onClick:()=>t(`men`),children:`Мужские`}),(0,P.jsx
