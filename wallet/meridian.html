  function toggleOpt(iconName, title, sub, key) {
    var on = !!Store.settings()[key];
    var sw = h("button", { class: "switch", role: "switch", "aria-checked": String(on), "aria-label": title });
    var node = h("button", { class: "opt", onclick: function () {
      on = !on;
      Store.setSetting(key, on);
      sw.setAttribute("aria-checked", String(on));
    } }, [
      h("span", { class: "opt__ico", html: icon(iconName) }),
      h("span", { style: "flex:1;text-align:left" }, [
        h("div", { class: "opt__t", text: title }),
        h("div", { class: "opt__s", text: sub })
      ]),
      sw
    ]);
    return node;
  }

  function linkOpt(iconName, title, sub, onclick) {
    return h("button", { class: "opt", onclick: onclick }, [
      h("span", { class: "opt__ico", html: icon(iconName) }),
      h("span", { style: "flex:1;text-align:left" }, [
        h("div", { class: "opt__t", text: title }),
        h("div", { class: "opt__s", text: sub })
      ]),
      h("span", { style: "color:var(--dim);display:flex", html: icon("chevron-right") })
    ]);
  }

  function revealSheet() {
    var pass = h("input", { class: "input", type: "password", placeholder: "Пароль", autocomplete: "current-password" });
    var hint = h("div", { class: "hint" });
    var body = h("div", {}, [
      h("div", { class: "warn" }, [
        h("span", { html: icon("alert") }),
        h("span", { text: "Убедитесь, что экран никто не видит и не записывает." })
      ]),
      h("label", { class: "field" }, [h("span", { class: "field__label", text: "Подтвердите пароль" }), pass]),
      hint
    ]);

    var show = h("button", { class: "btn btn--primary", html: icon("eye") + "<span>Показать</span>", onclick: function () {
      var stored = Store.state();
      if (!Vault.passwordMatches(pass.value, stored.auth.salt, stored.auth.hash)) {
        hint.className = "hint hint--bad";
        hint.textContent = "Неверный пароль";
        return;
      }
      var grid = h("div", { class: "seedgrid" });
      Store.recoveryPhrase().split(" ").forEach(function (word, i) {
        grid.appendChild(h("div", { class: "seedword" }, [
          h("span", { class: "seedword__i", text: String(i + 1) }),
          h("span", { text: word })
        ]));
      });
      UI.openSheet("Секретная фраза", [grid], [
        h("button", {
          class: "btn btn--ghost", html: icon("copy") + "<span>Скопировать</span>",
          onclick: function () { UI.copy(Store.recoveryPhrase(), "Фраза скопирована"); }
        }),
        h("button", { class: "btn btn--primary", text: "Скрыть", onclick: function () { UI.closeSheet(); } })
      ]);
    } });

    UI.openSheet("Секретная фраза", [body], [show]);
    setTimeout(function () { pass.focus(); }, 80);
  }

  /* ============================================================
     success overlay
     ============================================================ */

  function showSuccess(title, sub) {
    var node = h("div", { class: "done" }, [
      h("div", { class: "done__ring", html:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path class="tick" d="M20 6 9 17l-5-5"/></svg>' }),
      h("div", { class: "done__t", text: title, dataset: { text: title } }),
      h("div", { class: "done__s", text: sub }),
      h("div", { style: "position:absolute;left:16px;right:16px;bottom:22px" }, [
        h("button", { class: "btn btn--primary", text: "Готово", onclick: function () { close(); } })
      ])
    ]);
    function close() {
      node.remove();
      clearTimeout(timer);
      app().refresh();
    }
    var timer = setTimeout(close, 3200);
    UI.$("#device").appendChild(node);
  }

  global.Screens = {
    BRAND: BRAND, MARK: MARK,
    welcome: welcome, createFlow: createFlow, importFlow: importFlow, lockScreen: lockScreen,
    home: home, tokenScreen: tokenScreen, settingsScreen: settingsScreen,
    buySheet: buySheet, sellSheet: sellSheet, sendSheet: sendSheet,
    receiveSheet: receiveSheet, swapSheet: swapSheet, accountsSheet: accountsSheet,
    stakingScreen: stakingScreen, stakeSheet: stakeSheet, contactsSheet: contactsSheet,
    notificationsSheet: notificationsSheet, alertSheet: alertSheet, portfolioSheet: portfolioSheet,
    marketScreen: marketScreen, calcScreen: calcScreen, addressesScreen: addressesScreen,
    topUpSheet: topUpSheet, exchangeSheet: exchangeSheet, mailScreen: mailScreen
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<!-- app.js -->
<script>
/**
 * Router and boot.
 *
 * Five routes, one mount point. Which one opens first is decided by the
 * stored state: no wallet -> welcome, wallet but locked -> lock screen,
 * unlocked -> home.
 */
(function (global) {
  "use strict";

  var UI = global.UI, Store = global.WalletStore, Market = global.Market, Screens = global.Screens;

  var TICK_MS = 2600;
  var route = "welcome";
  var param = null;
  var current = null;
  var timer = null;
  var trail = [];        // where the back arrow goes, in order

  var ROUTES = {
    welcome:  function () { return Screens.welcome(); },
    create:   function () { return Screens.createFlow(); },
    import:   function () { return Screens.importFlow(); },
    lock:     function () { return Screens.lockScreen(); },
    home:     function () { return Screens.home(); },
    token:    function () { return Screens.tokenScreen(param); },
    staking:  function () { return Screens.stakingScreen(); },
    calc:     function () { return Screens.calcScreen(); },
    addresses: function () { return Screens.addressesScreen(); },
    market:   function () { return Screens.marketScreen(); },
    mail:     function () { return Screens.mailScreen(); },
    settings: function () { return Screens.settingsScreen(); }
  };

  var NEEDS_WALLET = { home: 1, token: 1, staking: 1, calc: 1, addresses: 1, market: 1, mail: 1, settings: 1 };

  function mount(node) {
    var host = UI.$("#app");
    /* Screens can register document-level listeners (the keypad does).
       Same teardown signal a closing sheet gets, so nothing outlives it. */
    if (current) current.dispatchEvent(new CustomEvent("sheet-teardown"));
    host.innerHTML = "";
    host.appendChild(node);
    current = node;
  }

  function render() {
    if (NEEDS_WALLET[route] && !Store.isUnlocked()) route = Store.exists() ? "lock" : "welcome";
    mount((ROUTES[route] || ROUTES.welcome)());
  }

  function go(name, value) {
    if (route !== name || param !== value) trail.push({ route: route, param: param });
    if (trail.length > 12) trail.shift();
    route = name;
    param = value == null ? null : value;
    UI.closeSheet(true);
    render();
    var scroll = UI.$(".scroll", current);
    if (scroll) scroll.scrollTop = 0;
  }

  /** One step back through the trail; home when there is nothing behind. */
  function back() {
    var previous = trail.pop();
    while (previous && (previous.route === route || previous.route === "welcome" ||
                        previous.route === "create" || previous.route === "import" ||
                        previous.route === "lock")) {
      previous = trail.pop();
    }
    route = previous ? previous.route : "home";
    param = previous ? previous.param : null;
    UI.closeSheet(true);
    render();
  }

  function refresh() { render(); }

  /** One market step: prices move, alerts fire, the screen catches up. */
  function tick() {
    Market.tick();

    if (Store.isUnlocked()) {
      var fired = Store.checkAlerts();
      if (fired.length) {
        var first = Market.byId(fired[0].tokenId);
        UI.toast(first.sym + " " + (fired[0].direction === "above" ? "выше" : "ниже") + " " +
          Market.money(fired[0].price, Store.settings().currency), "bell");
        if (!UI.sheetIsOpen()) render();       // the bell badge has to change
        return;
      }
    }

    if (current && current.__tick && !UI.sheetIsOpen()) {
      try { current.__tick(); } catch (e) { /* a half-rendered screen is not worth crashing over */ }
    }
  }

  function start() {
    trail = [];
    route = !Store.exists() ? "welcome" : Store.isUnlocked() ? "home" : "lock";
    render();
    clearInterval(timer);
    timer = setInterval(tick, TICK_MS);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && UI.sheetIsOpen()) UI.closeSheet();
    });

    /* Pause the market while the tab is in the background: a wallet that
       churns numbers nobody is looking at only burns battery. */
    document.addEventListener("visibilitychange", function () {
      clearInterval(timer);
      if (!document.hidden) timer = setInterval(tick, TICK_MS);
    });
  }

  global.App = { go: go, back: back, refresh: refresh, start: start, route: function () { return route; } };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})(typeof window !== "undefined" ? window : globalThis);

</script>
