<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="description" content="Meridian — демонстрационный криптокошелёк с большими кнопками «Купить» и «Продать». Сине-чёрная тема, симуляция рынка, без сети и реальных средств.">
<title>Meridian — криптокошелёк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%239cbbff'/><ellipse cx='32' cy='32' rx='10' ry='28' fill='none' stroke='%2304070f' stroke-opacity='.4' stroke-width='3'/><path d='M32 4v56' stroke='%2308111f' stroke-width='4'/></svg>">
<style>
/* ============================================================
   MERIDIAN — a blue-black wallet skin.

   Flat by rule: every surface is one solid colour, and the hierarchy is
   carried by lightness alone — a light accent fill with dark type for the
   one action that matters on a screen, plain dark plates for everything
   else. No gradients, no glows. Green and rose appear only on numbers
   that went up or down, where a hue actually means something.
   ============================================================ */

:root {
  --void:      #070a11;
  --app:       #0c111b;
  --card:      #141a27;
  --card-hi:   #1b2333;
  --card-lo:   #10161f;

  --line:      rgb(255 255 255 / 8%);
  --line-hi:   rgb(255 255 255 / 15%);

  --txt:       #ffffff;
  --dim:       #8b95ab;
  --dim-lo:    #5c6577;

  --blue:      #9cbbff;      /* the fill: light, so type on it is dark */
  --blue-lo:   #7ea4f5;
  --ink:       #08111f;      /* type on the fill */
  --cyan:      #6fd3ff;
  --soft:      #9cbbff;

  --up:        #24d6a0;
  --down:      #ff5c7c;

  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;

  --ease: cubic-bezier(.16, 1, .3, 1);
  --pop: cubic-bezier(.34, 1.56, .64, 1);

  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* The browser's own [hidden] rule loses to any display we set on a class,
   so state it once, loudly, and toggle visibility with el.hidden. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--void);
  color: var(--txt);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
input { border: 0; outline: 0; background: none; }

/* numbers line up in columns and stop jittering as prices tick */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

::-webkit-scrollbar { width: 0; height: 0; }

/* ---------- stage: the page behind the device ---------- */

.stage {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 28px 16px;
  background: var(--void);
}

.device {
  position: relative;
  width: min(414px, 100%);
  height: min(880px, calc(100dvh - 56px));
  min-height: 620px;
  border-radius: 42px;
  background: var(--app);
  border: 1px solid var(--line-hi);
  box-shadow: 0 40px 90px -30px rgb(0 0 0 / 80%);
  overflow: hidden;
  isolation: isolate;
}

@media (max-width: 480px) {
  .stage { padding: 0; }
  .device {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    border-radius: 0;
    border: 0;
    box-shadow: none;
  }
}

/* ---------- screens ---------- */

.screen {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.scroll {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 16px 28px;
  scrollbar-width: none;
}
.scroll--bar { padding-bottom: 12px; }

/* Buy and sell live here: always in reach, never scrolled away. */
.bottombar {
  flex: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--app);
  border-top: 1px solid var(--line);
}
.bottombar .bigbtn {
  height: 66px;
  border-radius: 18px;
  gap: 3px;
  font-size: 17px;
}
.bottombar .bigbtn svg { width: 20px; height: 20px; }
.bottombar .bigbtn__hint { font-size: 10.5px; }

.screen[hidden] { display: none; }

/* The intro flies a camera; the app only nods at it — a 300 ms push out of
   depth, enough to feel like the same world without slowing anyone down. */
.screen--enter { animation: screen-in .3s var(--ease) both; }
@keyframes screen-in {
  from { opacity: 0; transform: perspective(900px) translateZ(-70px) rotateX(2.5deg); }
  to   { opacity: 1; transform: none; }
}

/* ---------- top bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 10px;
}

.acct {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 12px 6px 6px;
  border-radius: 999px;
  background: rgb(255 255 255 / 4%);
  border: 1px solid var(--line);
  transition: background .18s, border-color .18s;
}
.acct:hover { background: rgb(255 255 255 / 8%); border-color: var(--line-hi); }

.acct__name { font-weight: 620; font-size: 14px; letter-spacing: -.01em; }
.acct__addr { font-size: 11.5px; color: var(--dim); letter-spacing: .01em; }

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  color: #04060d;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 22%);
}

.iconbtn {
  width: 38px; height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--dim);
  border: 1px solid transparent;
  transition: background .18s, color .18s, border-color .18s;
}
.iconbtn:hover { background: rgb(255 255 255 / 6%); color: var(--txt); border-color: var(--line); }
.iconbtn--on { color: var(--soft); background: var(--card-hi); border-color: var(--line-hi); }

.spacer { flex: 1; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--soft);
  background: var(--card-hi);
  border: 1px solid var(--line);
}
.pill__dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 3px rgb(111 211 255 / 18%);
}

/* ---------- balance block ---------- */

.balance { padding: 14px 4px 6px; text-align: center; }

.balance__label {
  font-size: 12.5px;
  color: var(--dim);
  letter-spacing: .02em;
}

.balance__value {
  margin-top: 4px;
  font-size: clamp(38px, 11vw, 46px);
  font-weight: 760;
  letter-spacing: -.035em;
  line-height: 1.05;
}
.balance__value--hidden { letter-spacing: .06em; }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 640;
  background: rgb(36 214 160 / 12%);
  color: var(--up);
}
.delta--down { background: rgb(255 92 124 / 12%); color: var(--down); }
.delta svg { width: 14px; height: 14px; }

.flash { animation: flash .5s var(--ease); }
@keyframes flash { 0% { color: var(--cyan); } 100% { color: inherit; } }

/* ---------- the two big buttons ---------- */

.bigrow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 18px 0 12px;
}

.bigbtn {
  position: relative;
  height: 104px;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -.01em;
  overflow: hidden;
  transition: transform .18s var(--pop), box-shadow .22s;
}
.bigbtn:active { transform: scale(.965); }
.bigbtn svg { width: 26px; height: 26px; }

.bigbtn--buy {
  color: var(--ink);
  background: var(--blue);
}
.bigbtn--buy:hover { background: #b1caff; }

.bigbtn--sell {
  color: var(--txt);
  background: var(--card-hi);
}
.bigbtn--sell:hover { background: #222c40; }

.bigbtn__hint {
  font-size: 11.5px;
  font-weight: 560;
  letter-spacing: .01em;
  opacity: .78;
}

/* ---------- secondary actions ---------- */

.quickrow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  padding-bottom: 16px;
}

.quick {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 11px 2px 9px;
  border-radius: var(--r-md);
  background: rgb(255 255 255 / 3.5%);
  border: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: -.01em;
  font-weight: 560;
  color: var(--dim);
  transition: background .18s, color .18s, transform .18s var(--pop);
}
.quick svg { width: 19px; height: 19px; color: var(--soft); }
.quick:hover { background: var(--card-hi); color: var(--txt); }
.quick:active { transform: scale(.94); }

/* ---------- tabs ---------- */

.tabs {
  position: relative;
  display: flex;
  gap: 2px;
  padding: 4px;
  border-radius: 14px;
  background: rgb(255 255 255 / 3.5%);
  border: 1px solid var(--line);
  margin-bottom: 12px;
}
.tab {
  flex: 1;
  padding: 8px 4px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  transition: color .18s, background .18s;
}
.tab[aria-selected="true"] {
  color: var(--txt);
  background: var(--card-hi);
}

/* ---------- asset rows ---------- */

.list { display: flex; flex-direction: column; gap: 4px; }

.row {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) 54px auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border-radius: var(--r-md);
  text-align: left;
  border: 1px solid transparent;
  transition: background .16s, border-color .16s;
}
/* rows without a trend line — accounts, pickers — keep three columns */
.row--wide { grid-template-columns: 42px minmax(0, 1fr) auto; }

.row:hover { background: rgb(255 255 255 / 4%); border-color: var(--line); }
.row:active { background: rgb(255 255 255 / 7%); }

.coin {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 780;
  font-size: 13px;
  letter-spacing: -.02em;
  color: #04060d;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 20%);
}

.row__name { font-weight: 620; font-size: 15px; letter-spacing: -.01em; }
/* the amount gives way, the qualifier never does */
.row__sub {
  font-size: 12.5px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.row__sub > .row__amount { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__right { text-align: right; }
.row__val { font-weight: 620; font-size: 15px; }
.row__delta { font-size: 12.5px; font-weight: 560; color: var(--up); }
.row__delta--down { color: var(--down); }

.spark { width: 54px; height: 22px; flex: none; }

/* the trend line is the first thing to go when the row gets tight */
@media (max-width: 379px) {
  .row { grid-template-columns: 42px minmax(0, 1fr) auto; }
  .spark { display: none; }
}

/* a small count riding on the bell */
.badge {
  position: absolute;
  top: 4px; right: 4px;
  min-width: 16px; height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--blue);
  color: var(--ink);
  font-size: 10px;
  font-weight: 750;
  line-height: 16px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--app);
}
.iconbtn { position: relative; }

/* a note under the balance: what part of it is locked up */
.balance__note { margin-top: 7px; font-size: 12.5px; color: var(--dim); }
button.balance { display: block; width: 100%; border-radius: var(--r-md); }
button.balance:hover { background: rgb(255 255 255 / 3%); }

/* an inline qualifier on a row's second line */
/* A qualifier on a row's second line. Kept to an icon and a number: the
   column is barely 140 px, and the balance must not lose room to it. */
.row__tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex: none;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--soft);
  background: var(--card-hi);
  white-space: nowrap;
}
.row__tag svg { width: 11px; height: 11px; }
.row--on { background: var(--card-hi); border-color: var(--line-hi); }

/* ---------- staking ---------- */

.stat { padding: 2px 0 10px; }
.stat__label { font-size: 12.5px; color: var(--dim); }
.stat__value { font-size: 28px; font-weight: 740; letter-spacing: -.03em; margin-top: 2px; }

.apy {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  color: var(--up);
  background: rgb(36 214 160 / 12%);
}
.stakecard + .stakecard { margin-top: 10px; }
.reward { color: var(--up); }

/* allocation bars in the portfolio sheet */
.alloc { padding: 8px 2px; }
.bar {
  height: 6px;
  margin-top: 7px;
  border-radius: 999px;
  background: rgb(255 255 255 / 7%);
  overflow: hidden;
}
.bar__fill { height: 100%; border-radius: 999px; }

/* a contact row: the body picks, the trailing button deletes */
.contact__pick {
  min-width: 0;
  text-align: left;
  display: block;
}
.contact__pick .row__sub { display: block; }

.tx--unread { background: var(--card); }

/* ---------- section headings & empty states ---------- */

.h {
  font-size: 12px;
  font-weight: 640;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim-lo);
  padding: 16px 4px 8px;
}

.empty {
  padding: 46px 20px;
  text-align: center;
  color: var(--dim);
  font-size: 13.5px;
}
.empty svg { width: 34px; height: 34px; color: var(--dim-lo); margin-bottom: 10px; }

/* ---------- cards ---------- */

.card {
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--line);
  padding: 14px;
}

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13.5px; }
.kv__k { color: var(--dim); }
.kv__v { font-weight: 600; text-align: right; }
.kv + .kv { border-top: 1px solid var(--line); }

/* ---------- chart ---------- */

.chartwrap { position: relative; margin: 6px -4px 0; }
.chart { width: 100%; height: 168px; display: block; overflow: visible; }

.seg {
  display: flex;
  gap: 4px;
  margin-top: 10px;
  padding: 3px;
  border-radius: 12px;
  background: rgb(255 255 255 / 3.5%);
  border: 1px solid var(--line);
}
.segbtn {
  flex: 1;
  padding: 7px 2px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 620;
  color: var(--dim);
  transition: color .16s, background .16s;
}
.segbtn[aria-pressed="true"] { color: var(--txt); background: var(--card-hi); }

/* ---------- buttons ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  height: 54px;
  text-decoration: none;          /* some buttons are links to mailto: */
  border-radius: 16px;
  font-size: 16px;
  font-weight: 680;
  letter-spacing: -.01em;
  transition: transform .16s var(--pop), opacity .16s, background .18s;
}
.btn:active { transform: scale(.975); }
.btn svg { width: 19px; height: 19px; }
.btn[disabled] { opacity: .38; pointer-events: none; }

.btn--primary {
  color: var(--ink);
  background: var(--blue);
}
.btn--primary:hover { background: #b1caff; }

.btn--ghost {
  color: var(--txt);
  background: var(--card-hi);
}
.btn--ghost:hover { background: #222c40; }
.btn--danger { color: var(--down); background: rgb(255 92 124 / 10%); border: 1px solid rgb(255 92 124 / 26%); }
.btn--sm { height: 44px; font-size: 14.5px; border-radius: 13px; }

/* press-and-hold confirmation: a deliberate gesture for a money move */
.hold { position: relative; overflow: hidden; }
.hold__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: rgb(8 17 31 / 16%);
  pointer-events: none;
}
.hold__label { position: relative; display: flex; align-items: center; gap: 9px; }

/* ---------- inputs ---------- */

.field { display: block; padding: 14px 0 4px; }
.field__label {
  display: block;
  font-size: 12px;
  font-weight: 620;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--dim-lo);
  margin-bottom: 8px;
}
.input {
  width: 100%;
  padding: 14px 14px;
  border-radius: 14px;
  background: rgb(255 255 255 / 4%);
  border: 1px solid var(--line);
  font-size: 15px;
  transition: border-color .18s, background .18s;
}
.input:focus { border-color: var(--blue); background: var(--card-hi); }
.input::placeholder { color: var(--dim-lo); }
.input--mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; letter-spacing: -.01em; }
.input--bad { border-color: rgb(255 92 124 / 60%); }

.hint { font-size: 12.5px; color: var(--dim); padding: 8px 2px 0; }
.hint--bad { color: var(--down); }

/* ---------- amount display + keypad ---------- */

.amount {
  text-align: center;
  padding: 12px 8px 4px;
}
.amount__value {
  font-size: clamp(36px, 12vw, 48px);
  font-weight: 740;
  letter-spacing: -.04em;
  line-height: 1.05;
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
}
.amount__cur { color: var(--dim); font-size: .62em; font-weight: 640; }
.amount__zero { color: var(--dim-lo); }
.amount__sub { margin-top: 8px; font-size: 14px; color: var(--dim); font-weight: 560; }
.amount__caret {
  display: inline-block;
  width: 2px;
  height: .82em;
  background: var(--cyan);
  border-radius: 2px;
  animation: caret 1.05s steps(1, end) infinite;
  transform: translateY(.04em);
}
@keyframes caret { 50% { opacity: 0; } }

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  padding: 6px 0 4px;
}
.key {
  height: 46px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 620;
  color: var(--txt);
  transition: background .14s, transform .14s var(--pop);
}
.key:hover { background: rgb(255 255 255 / 6%); }
.key:active { background: var(--card-hi); transform: scale(.93); }
.key svg { width: 22px; height: 22px; }

.chips { display: flex; gap: 7px; padding: 2px 0 4px; }
.chip {
  flex: 1;
  padding: 8px 4px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 620;
  color: var(--txt);
  background: var(--card-hi);
  transition: background .16s, transform .16s var(--pop);
}
.chip:hover { background: #222c40; }
.chip:active { transform: scale(.94); }

/* horizontal token picker */
.picker { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.pick {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: 7px 13px 7px 7px;
  border-radius: 999px;
  background: rgb(255 255 255 / 4%);
  border: 1px solid var(--line);
  font-weight: 620;
  font-size: 13.5px;
  transition: background .16s, border-color .16s;
}
.pick[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--ink); }
.pick .coin { width: 26px; height: 26px; font-size: 10px; }

/* ---------- calculator ---------- */

.calcline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 14px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--line);
}
.calcline--active { border-color: var(--blue); background: var(--card-hi); }
.calcline__value {
  font-size: 30px;
  font-weight: 720;
  letter-spacing: -.03em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.calcline__unit {
  flex: none;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--card-hi);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--soft);
}
.calcline--active .calcline__unit { background: var(--blue); color: var(--ink); }
.calcline__label { font-size: 12px; color: var(--dim); margin-bottom: 4px; }

.calcswap { display: flex; justify-content: center; margin: -12px 0; position: relative; z-index: 2; }

/* ---------- address generator ---------- */

.addr {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
}
.addr:hover { background: var(--card); border-color: var(--line); }
.addr__i {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--card-hi);
  color: var(--dim);
  font-size: 13px;
  font-weight: 700;
}
.addr__value { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.addr__note { display: block; font-size: 11.5px; color: var(--dim); margin-top: 1px; }
.addr--used .addr__i { background: var(--blue); color: var(--ink); }

.qrcard {
  display: inline-block;
  padding: 12px;
  border-radius: 18px;
  background: #fff;
}

/* ---------- sheets ---------- */

.sheet {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.sheet[hidden] { display: none; }

.sheet__veil {
  position: absolute;
  inset: 0;
  background: rgb(2 4 10 / 68%);
  backdrop-filter: blur(6px);
  animation: fade .22s ease both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sheet__panel {
  position: relative;
  max-height: 92%;
  display: flex;
  flex-direction: column;
  border-radius: 28px 28px 0 0;
  background: var(--app);
  border: 1px solid var(--line-hi);
  border-bottom: 0;
  box-shadow: 0 -30px 70px -30px rgb(0 0 0 / 90%);
  animation: sheet-up .34s var(--ease) both;
}
@keyframes sheet-up { from { transform: translateY(102%); } to { transform: none; } }
.sheet--out .sheet__panel { animation: sheet-down .24s ease-in both; }
.sheet--out .sheet__veil { animation: fade .24s ease-in reverse both; }
@keyframes sheet-down { to { transform: translateY(102%); } }

.grabber {
  width: 38px; height: 4px;
  border-radius: 999px;
  background: rgb(255 255 255 / 18%);
  margin: 10px auto 0;
  flex: none;
}

.sheet__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 4px;
}
.sheet__title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.sheet__body { padding: 4px 16px 6px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.sheet__foot { padding: 10px 16px 18px; }

/* ---------- seed phrase ---------- */

.seedgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 4px 0;
}
.seedword {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 10px 8px;
  border-radius: 12px;
  background: rgb(255 255 255 / 4%);
  border: 1px solid var(--line);
  font-size: 13.5px;
  font-weight: 600;
}
.seedword__i { font-size: 11px; color: var(--dim-lo); min-width: 13px; }

.blurred { position: relative; }
.blurred > .seedgrid { filter: blur(9px); opacity: .5; user-select: none; }
.blurred__cta {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 620;
  color: var(--soft);
}
.blurred__cta svg { width: 22px; height: 22px; }

/* ---------- warning banner ---------- */

.warn {
  display: flex;
  gap: 10px;
  padding: 12px 13px;
  border-radius: 14px;
  font-size: 12.8px;
  line-height: 1.42;
  color: #ffd7de;
  background: rgb(255 92 124 / 9%);
  border: 1px solid rgb(255 92 124 / 26%);
}
.warn svg { width: 17px; height: 17px; flex: none; margin-top: 1px; color: var(--down); }
.warn--info { color: var(--soft); background: var(--card); border-color: var(--line-hi); }
.warn--info svg { color: var(--cyan); }

/* ---------- activity ---------- */

.tx { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: var(--r-md); text-align: left; border: 1px solid transparent; }
.tx:hover { background: rgb(255 255 255 / 4%); border-color: var(--line); }
.tx__ico {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--card-hi);
  color: var(--soft);
}
.tx__ico svg { width: 17px; height: 17px; }
.tx__ico--in { background: rgb(36 214 160 / 13%); color: var(--up); }
.tx__ico--out { background: rgb(255 92 124 / 12%); color: var(--down); }
.tx__t { font-weight: 620; font-size: 14.5px; }
.tx__s { font-size: 12.5px; color: var(--dim); }
.tx__a { font-weight: 620; font-size: 14.5px; text-align: right; }
.tx__a--in { color: var(--up); }

/* ---------- collectibles ---------- */

.nftgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nft { border-radius: var(--r-md); overflow: hidden; background: var(--card); border: 1px solid var(--line); text-align: left; transition: transform .2s var(--ease), border-color .2s; }
.nft:hover { transform: translateY(-3px); border-color: var(--line-hi); }
.nft svg { display: block; width: 100%; height: auto; }
.nft__meta { padding: 9px 11px 11px; }
.nft__t { font-size: 13.5px; font-weight: 640; }
.nft__s { font-size: 11.5px; color: var(--dim); }

/* a letter, shown as the plain text it is */
.letter {
  margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--txt);
}

/* ---------- settings ---------- */

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 12px;
  border-radius: var(--r-md);
  text-align: left;
  border: 1px solid transparent;
  transition: background .16s;
}
.opt:hover { background: rgb(255 255 255 / 4%); }
.opt__ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--card-hi); color: var(--soft); flex: none; }
.opt__ico svg { width: 16px; height: 16px; }
.opt__t { font-weight: 600; font-size: 14.5px; }
.opt__s { font-size: 12px; color: var(--dim); }

.switch {
  width: 44px; height: 26px;
  border-radius: 999px;
  background: rgb(255 255 255 / 10%);
  position: relative;
  flex: none;
  transition: background .2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform .22s var(--pop);
}
.switch[aria-checked="true"] { background: var(--blue); }
.switch[aria-checked="true"]::after { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* ---------- onboarding ---------- */

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px 26px;
  text-align: center;
}
.hero__mark { width: 92px; height: 92px; animation: bob 5.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.hero__title { font-size: 32px; font-weight: 780; letter-spacing: -.035em; }
.hero__sub { font-size: 14.5px; color: var(--dim); max-width: 30ch; line-height: 1.5; }

.foot { padding: 0 16px 22px; display: flex; flex-direction: column; gap: 10px; }

.steps { display: flex; gap: 6px; justify-content: center; padding: 6px 0 2px; }
.step { width: 22px; height: 3px; border-radius: 999px; background: rgb(255 255 255 / 12%); }
.step--on { background: var(--blue); }

/* ---------- toast ---------- */

.toasts {
  position: absolute;
  left: 0; right: 0; bottom: 18px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  padding: 0 16px;
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: 100%;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 580;
  color: var(--txt);
  background: var(--card-hi);
  border: 1px solid var(--line-hi);
  box-shadow: 0 18px 40px -18px rgb(0 0 0 / 90%);
  animation: toast-in .28s var(--pop) both;
}
.toast svg { width: 16px; height: 16px; color: var(--cyan); flex: none; }
.toast--out { animation: toast-out .22s ease-in both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ---------- success overlay ---------- */

.done {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 28px;
  text-align: center;
  background: var(--app);
  animation: fade .2s ease both;
}
.done__ring {
  width: 96px; height: 96px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card-hi);
  animation: ring 2.6s ease-out infinite;
}
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgb(156 187 255 / 30%); } 70%, 100% { box-shadow: 0 0 0 34px rgb(156 187 255 / 0%); } }
.done__ring svg { width: 54px; height: 54px; color: var(--cyan); }
.done__t {
  position: relative;
  font-size: 24px;
  font-weight: 740;
  letter-spacing: -.03em;
}
.done__t::before,
.done__t::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  mix-blend-mode: screen;
  pointer-events: none;
}
.done__t::before { color: #ff2f6d; animation: split-l .5s var(--ease) both; }
.done__t::after  { color: #12e6ff; animation: split-r .5s var(--ease) both; }
@keyframes split-l { from { transform: translateX(-14px); opacity: 1; } to { transform: none; opacity: 0; } }
@keyframes split-r { from { transform: translateX(14px);  opacity: 1; } to { transform: none; opacity: 0; } }
.done__s { font-size: 14px; color: var(--dim); }

.tick { stroke-dasharray: 60; stroke-dashoffset: 60; animation: tick .5s var(--ease) .12s forwards; }
@keyframes tick { to { stroke-dashoffset: 0; } }

/* ---------- misc ---------- */

.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.center { text-align: center; }
.muted { color: var(--dim); }
.rowsplit { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gap { display: flex; flex-direction: column; gap: 10px; }

.swapline {
  display: flex;
  justify-content: center;
  margin: -13px 0;
  position: relative;
  z-index: 2;
}
.swapbtn {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--card-hi);
  border: 1px solid var(--line-hi);
  color: var(--soft);
  transition: transform .3s var(--ease), background .18s;
}
.swapbtn:hover { background: #222c40; }
.swapbtn--spin { transform: rotate(180deg); }
.swapbtn svg { width: 17px; height: 17px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ============================================================
   INTRO — the opening sequence.

   One scroll position, five progress values (--mark, --type, --wall,
   --flash, --end), and every layer below is a transform written in terms
   of them. Nothing animates on a timer, so the camera answers the finger
   exactly like a scroll-driven site.
   ============================================================ */

.intro { background: #000; }

.intro__stage {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  perspective: 620px;
  perspective-origin: 50% 46%;
  pointer-events: none;
  --p: 0; --mark: 0; --type: 0; --wall: 0; --flash: 0; --end: 0;
}

/* the deep blue that sits behind everything, breathing with the scroll */
.intro__glow {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(46% 38% at 50% 62%, rgb(30 70 255 / 60%), transparent 70%),
    radial-gradient(30% 26% at 50% 44%, rgb(23 193 255 / 34%), transparent 72%);
  opacity: calc(.22 + .38 * var(--p));
  filter: blur(18px);                     /* constant: a changing radius re-rasterises every frame */
  transform: scale(calc(.75 + .4 * var(--p)));
}

.intro__scene {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/* ---------- the wireframe corridor ---------- */

/* The planes never move; their grid does. Sliding the background along the
   axis that depth maps to gives an endless corridor, so the camera can fly
   as long as it likes without ever reaching an edge. */
.tunnel {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

.tunnel__plane {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4200px;
  height: 4200px;
  margin: -2100px 0 0 -2100px;
  background-image:
    repeating-linear-gradient(90deg, rgb(255 255 255 / 26%) 0 1px, transparent 1px 190px),
    repeating-linear-gradient(0deg,  rgb(255 255 255 / 26%) 0 1px, transparent 1px 190px);
  background-position: 0 calc(var(--p) * 2280px);
  opacity: .5;
  backface-visibility: hidden;
  mask-image: radial-gradient(60% 60% at 50% 50%, #000 30%, transparent 78%);
}
.tunnel__plane--floor { transform: rotateX(90deg)  translateZ(-260px); }
.tunnel__plane--ceil  { transform: rotateX(-90deg) translateZ(-300px); }
.tunnel__plane--left  { transform: rotateY(90deg)  translateZ(-330px); }
.tunnel__plane--right { transform: rotateY(-90deg) translateZ(-330px); }

/* ---------- beat 1: the mark draws itself ---------- */

.intro__beat {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  transform-style: preserve-3d;
}

.intro__beat--mark {
  /* Perspective is 620px: push a layer near that and it fills the frame as a
     white haze, so this stops well short and is gone before it gets there. */
  opacity: calc(1 - max(0, (var(--mark) - .58)) * 2.6);
  transform: translateZ(calc(-40px + 300px * var(--mark))) scale(calc(.86 + .34 * var(--mark)));
}
.intro__mark { width: 46%; max-width: 210px; overflow: visible; }
.intro__mark .draw {
  stroke-dasharray: 1;
  stroke-dashoffset: calc(1 - var(--mark));
}
.intro__mark .meridian {
  filter: drop-shadow(0 0 10px rgb(156 187 255 / 90%));
  stroke-dashoffset: calc(1 - max(0, (var(--mark) - .3)) * 1.43);
}

/* ---------- beat 2: the name goes past the camera ---------- */

.intro__beat--type {
  opacity: calc(min(1, var(--type) * 5) * (1 - max(0, (var(--type) - .82)) * 5.5));
  transform: rotateY(-26deg) rotateX(4deg);
}
.intro__word {
  position: absolute;
  white-space: nowrap;
  font-size: clamp(66px, 25vw, 128px);
  font-weight: 800;
  letter-spacing: -.05em;
  line-height: 1;
  will-change: transform;
}
.intro__word--solid {
  color: #fff;
  text-shadow: 0 0 34px rgb(60 120 255 / 90%), 0 0 90px rgb(30 70 255 / 70%);
  transform: translate3d(calc(72vw - 172vw * var(--type)), 0, 190px);
}
.intro__word--ghost {
  color: transparent;
  -webkit-text-stroke: 1.4px rgb(255 255 255 / 62%);
  transform: translate3d(calc(96vw - 210vw * var(--type)), -78px, -120px);
}
.intro__word--echo {
  color: transparent;
  -webkit-text-stroke: 1px rgb(156 187 255 / 30%);
  transform: translate3d(calc(126vw - 268vw * var(--type)), 96px, -520px);
}

/* ---------- beat 3: the wall of panels ---------- */

.intro__beat--wall {
  opacity: calc(min(1, var(--wall) * 8) * (1 - max(0, (var(--wall) - .9)) * 10));
  transform-style: preserve-3d;
}
.panel {
  position: absolute;
  overflow: hidden;
  width: 208px;
  height: 126px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-radius: 14px;
  background: #0d1422;
  border: 1px solid rgb(156 187 255 / 45%);
  box-shadow: 0 0 50px rgb(30 70 255 / 34%);
  text-align: left;
  /* each panel is staggered along the corridor, so they arrive one after
     another instead of as a single slab */
  --phase: clamp(0, (var(--wall) - var(--i) * .055) * 1.34, 1);
  transform:
    translate3d(var(--x), var(--y), calc(-2900px + 3500px * var(--phase)))
    rotateY(calc(var(--tilt) * 1deg));
  opacity: calc(min(1, var(--phase) * 6) * (1 - max(0, (var(--phase) - .88)) * 8));
  will-change: transform;
}

/* ---------- beat 4: the seam, split into channels ---------- */

.intro__flash {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: calc(min(1, var(--flash) * 3) * (1 - max(0, (var(--flash) - .5)) * 2));
  mix-blend-mode: screen;
}
.intro__flash::before,
.intro__flash::after {
  content: attr(data-text);
  position: absolute;
  font-size: clamp(40px, 15vw, 76px);
  font-weight: 800;
  letter-spacing: -.045em;
  filter: blur(calc(2px * (1 - var(--flash))));
}
.intro__flash::before {
  color: #ff2f6d;
  transform: translateX(calc(-42px + 40px * var(--flash))) skewX(-6deg);
}
.intro__flash::after {
  color: #12e6ff;
  transform: translateX(calc(42px - 40px * var(--flash))) skewX(-6deg);
}

/* ---------- the scroller and the end card ---------- */

.intro__scroll {
  position: relative;
  z-index: 1;
  padding: 0;
  scroll-behavior: auto;
}
.intro__runway { height: 460%; }

.intro__end {
  position: relative;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 12px;
  padding: 0 20px 26px;
  opacity: var(--end-o, 1);
}
.intro__title {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -.045em;
  color: #fff;
  text-shadow: 0 0 40px rgb(30 70 255 / 70%);
}
.intro__sub { font-size: 14.5px; line-height: 1.5; color: var(--dim); max-width: 32ch; }
.intro__actions { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }

.intro__cue {
  position: absolute;
  left: 0; right: 0; bottom: 22px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgb(255 255 255 / 55%);
  pointer-events: none;
  transition: opacity .3s;
  animation: cue 2.2s ease-in-out infinite;
}
.intro__cue svg { width: 18px; height: 18px; }
@keyframes cue { 50% { transform: translateY(6px); } }

.intro__skip {
  position: absolute;
  top: 14px; right: 14px;
  z-index: 3;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: rgb(255 255 255 / 70%);
  background: rgb(255 255 255 / 8%);
  transition: opacity .3s, background .2s;
}
.intro__skip:hover { background: rgb(255 255 255 / 14%); color: #fff; }

/* a still frame for anyone who would rather not be flown anywhere */
.intro--still .intro__cue,
.intro--still .intro__skip { display: none; }

@media (prefers-reduced-motion: reduce) {
  .intro__cue { animation: none; }
}

</style>

<script>
/**
 * Wallet state: accounts, balances, history, and the operations that move
 * money between them. Everything lives in localStorage under one key, and
 * nothing leaves the browser.
 *
 * The linked card is what makes "купить" and "продать" symmetrical: buying
 * draws from the card, selling pays back into it, so neither button mints
 * value out of nowhere.
 *
 * Staking rewards are computed from elapsed time rather than incremented on
 * a timer, so they keep accruing across a reload and cannot drift. Demo time
 * runs fast — a second of watching is an hour of staking — otherwise nothing
 * visible would ever happen at 7 % a year.
 */
(function (global) {
  "use strict";

  var KEY = "meridian.wallet.v1";
  var LEGACY_KEY = "cobalt.wallet.v1";   // the wallet shipped under its old name
  var Market = global.Market;
  var Vault = global.Vault;

  var FEES = { buy: 0.012, sell: 0.012, swap: 0.0025 };
  var NETWORK_FEE_USD = 0.12;
  var HOURS_PER_SECOND = 1;        // demo clock: 1 s watched = 1 h staked
  var MAX_NOTES = 50;

  var state = null;      // persisted
  var phrase = null;     // in memory only, while unlocked

  function read() {
    try {
      if (!global.localStorage) return null;
      var raw = global.localStorage.getItem(KEY) || global.localStorage.getItem(LEGACY_KEY);
      return raw ? migrate(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function save() {
    try {
      if (global.localStorage) global.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* private mode: the session still works, it just won't survive */ }
  }

  /**
   * Fills in whatever a stored wallet predates. Wallets written before the
   * rename keep deriving addresses from their original namespace, and their
   * house-token balances are moved onto the new ticker.
   */
  function migrate(stored) {
    if (!stored || !stored.accounts) return stored;
    stored.settings = stored.settings || { currency: "USD", hidden: false, network: "mainnet" };
    stored.card = stored.card || { last4: "4417", available: 5000 };
    stored.contacts = stored.contacts || [];
    stored.alerts = stored.alerts || [];
    stored.notes = stored.notes || [];
    stored.mail = stored.mail || defaultMail();
    stored.derive = stored.derive || "cobalt";
    stored.accounts.forEach(function (acc) {
      acc.balances = acc.balances || {};
      acc.stakes = acc.stakes || [];
      if (acc.balances.cob != null) {                 // COB became MRD
        acc.balances.mrd = (acc.balances.mrd || 0) + acc.balances.cob;
        delete acc.balances.cob;
      }
    });
    (stored.txs || []).forEach(function (tx) {
      if (tx.tokenId === "cob") tx.tokenId = "mrd";
      if (tx.toTokenId === "cob") tx.toTokenId = "mrd";

  function isUnlocked() { return !!state; }

  function signature() { return Vault.base58(Vault.randomBytes(32)); }

  function account() { return state.accounts[state.active]; }

  function balanceOf(tokenId) {
    var b = account().balances[tokenId];
    return b ? b : 0;
  }

  function setBalance(tokenId, value) {
    account().balances[tokenId] = Math.max(0, value);
  }

  /** Locked in stakes — owned, but not spendable until unstaked. */
  function stakedOf(tokenId) {
    return (account().stakes || []).reduce(function (sum, st) {
      return st.tokenId === tokenId ? sum + st.amount : sum;
    }, 0);
  }

  /** Everything owned of a token: what can be spent plus what is staked. */
  function holdingOf(tokenId) { return balanceOf(tokenId) + stakedOf(tokenId); }

  /** Portfolio value in USD at current prices, staked positions included. */
  function total() {
    return Market.TOKENS.reduce(function (sum, t) {
      return sum + holdingOf(t.id) * t.price;
    }, 0);
  }

  function stakedTotal() {
    return Market.TOKENS.reduce(function (sum, t) { return sum + stakedOf(t.id) * t.price; }, 0);
  }

  /** Weighted 24h move of the portfolio, so the header figure means something. */
  function totalChange() {
    var now = total();
    if (now <= 0) return 0;
    var before = Market.TOKENS.reduce(function (sum, t) {
      var s = Market.series(t.id, "1d");
      return sum + holdingOf(t.id) * s[0];
    }, 0);
    return before > 0 ? ((now - before) / before) * 100 : 0;
  }

  /**
   * Portfolio value across a timeframe: today's holdings valued at each
   * historical price. It answers "what would this basket have been worth",
   * which is the only honest reading without a ledger of past balances.
   */
  function totalSeries(frameId) {
    var out = null;
    Market.TOKENS.forEach(function (t) {
      var units = holdingOf(t.id);
      if (!units) return;
      var s = Market.series(t.id, frameId);
      if (!out) out = s.map(function (v) { return v * units; });
      else out = out.map(function (v, i) { return v + s[i] * units; });
    });
    return out || Market.series("usdc", frameId).map(function () { return 0; });
  }

  /* ---------- creation, locking ---------- */

  function starterPortfolio() {
    return { mrd: 1180, btc: 0.0412, eth: 1.24, sol: 12.482, ton: 320, usdc: 1840.5, doge: 12500 };
  }

  /** A little history so the activity tab has something true to show. */
  /** One position already running, so the staking screen opens with content. */
  function starterStakes() {
    return [{
      id: signature(), tokenId: "sol", amount: 6, validator: "polaris",
      apy: Market.apyFor("sol", "polaris"),
      since: Date.now() - 1080 * 1000,    // 1080 demo hours ≈ 45 days of rewards
      carried: 0
    }];
  }

  function starterContacts() {
    return [
      { id: signature(), name: "Аня", address: Vault.base58(Vault.digest("meridian/demo/anya")), note: "обмен на карту" },
      { id: signature(), name: "Холодный кошелёк", address: Vault.base58(Vault.digest("meridian/demo/cold")), note: "долгое хранение" }
    ];
  }

  function starterHistory() {
    var day = 86400000;
    var now = Date.now();
    return [
      { id: signature(), kind: "buy",  tokenId: "sol",  amount: 4.2,   usd: 774.2,  fee: 9.29, at: now - day * 2 - 3600e3 * 5, status: "ok" },
      { id: signature(), kind: "swap", tokenId: "usdc", amount: 620,   usd: 620,    fee: 1.55, at: now - day * 4, status: "ok",
        toTokenId: "mrd", toAmount: 284.3 },
      { id: signature(), kind: "in",   tokenId: "eth",  amount: 0.35,  usd: 1338.6, fee: 0,    at: now - day * 9, status: "ok",
        address: Vault.base58(Vault.digest("meridian/demo/sender")) },
      { id: signature(), kind: "buy",  tokenId: "btc",  amount: 0.0412, usd: 2935.1, fee: 35.2, at: now - day * 21, status: "ok" }
    ];
  }

  function create(password, recovery) {
    var salt = Vault.newSalt();
    state = {
      v: 1,
      auth: { salt: salt, hash: Vault.passwordHash(password, salt) },
      sealed: Vault.sealPhrase(recovery, password, salt),
      derive: "meridian",
      accounts: [{
        name: "Основной",
        index: 0,
        address: Vault.addressFor(recovery, 0, "meridian"),
        balances: starterPortfolio(),
        stakes: starterStakes()
      }],
      active: 0,
      settings: { currency: "USD", hidden: false, network: "mainnet" },
      txs: starterHistory(),
      card: { last4: "4417", available: 5000 },
      contacts: starterContacts(),
      alerts: [],
      notes: [],
      mail: defaultMail()
    };
    phrase = recovery;
    save();
    return state;
  }

  function unlock(password) {
    var stored = read();
    if (!stored) return false;
    if (!Vault.passwordMatches(password, stored.auth.salt, stored.auth.hash)) return false;
    state = stored;
    phrase = Vault.openPhrase(stored.sealed, password, stored.auth.salt);
    return true;
  }

  function lock() { state = null; phrase = null; }

  function reset() {
    lock();
    try { if (global.localStorage) global.localStorage.removeItem(KEY); } catch (e) {}
  }

  /** Only available while unlocked — the phrase is never read from storage. */
  function recoveryPhrase() { return phrase; }

  function addAccount(name) {
    var index = state.accounts.length;
    state.accounts.push({
      name: name || "Счёт " + (index + 1),
      index: index,
      address: Vault.addressFor(phrase, index, state.derive),
      balances: {},
      stakes: []
    });
    state.active = index;
    save();
  }

  function selectAccount(i) {
    state.active = Math.max(0, Math.min(i, state.accounts.length - 1));
    save();
  }

  /* ---------- operations ---------- */

  /* ---------- letters ---------- */

  var MAIL_GROUPS = {
    trade:   { label: "Покупка и продажа", hint: "когда купили или продали монету",     kinds: ["buy", "sell"] },
    move:    { label: "Переводы",          hint: "отправка, входящие и вывод на биржу", kinds: ["out", "in", "exchange"] },
    staking: { label: "Стейкинг",          hint: "ставки, вывод и забранные награды",   kinds: ["stake", "unstake", "reward"] },
    alerts:  { label: "Оповещения о цене", hint: "когда цена пересекла вашу отметку",   kinds: ["alert"] },
    card:    { label: "Пополнение карты",  hint: "когда положили денег на карту",       kinds: ["topup"] }
  };

  var MAX_OUTBOX = 60;

  function defaultMail() {
    return {
      address: "",
      on: { trade: true, move: true, staking: false, alerts: true, card: false },
      outbox: []
    };
  }

  function mail() { return state.mail; }

  /** Deliberately plain: an address is a name, an at-sign and a dotted host. */
  function emailLooksValid(address) {
    return /^[^\s@]{1,64}@[^\s@.]+(\.[^\s@.]+)+$/.test(String(address || "").trim());
  }

  function setMailAddress(address) {
    var value = String(address || "").trim();
    if (value && !emailLooksValid(value)) throw new Error("адрес почты выглядит неверно");
    state.mail.address = value;
    save();
  }

  function setMailGroup(group, enabled) {
    if (!MAIL_GROUPS[group]) throw new Error("нет такой группы событий");
    state.mail.on[group] = !!enabled;
    save();
  }

  function groupOf(kind) {
    var found = null;
    Object.keys(MAIL_GROUPS).forEach(function (key) {
      if (MAIL_GROUPS[key].kinds.indexOf(kind) !== -1) found = key;
    });
    return found;
  }

  /** The letter one event becomes. Composed here so it can be read back. */
  function composeLetter(kind, title, detail) {
    var acc = account();
    var when = Date.now();
    return {
      id: signature(),
      kind: kind,
      title: title,
      detail: detail || "",
      account: acc.name,
      address: acc.address,
      balance: total(),
      currency: state.settings.currency,
      at: when,
      sent: false
    };
  }

  function letterTime(at) { return new Date(at).toLocaleString("ru-RU"); }

  /** The letter as text: what lands in the mail client. */
  function letterBody(letter) {
    return [
      "Счёт: " + letter.account + " (" + letter.address.slice(0, 6) + "…" + letter.address.slice(-4) + ")",
      "Событие: " + letter.title,
      letter.detail ? "Подробности: " + letter.detail : null,
      "Баланс после: " + Market.money(letter.balance, letter.currency, { dp: 2 }),
      "Время: " + letterTime(letter.at),
      "",
      "—",
      "Письмо сформировано кошельком Meridian на вашем устройстве."
    ].filter(function (line) { return line !== null; }).join("\n");
  }

  function letterSubject(letter) { return "Meridian · " + letter.title; }

  /** Queues a letter if this kind of event is switched on and there is an address. */
  function queueLetter(kind, title, detail) {
    var group = groupOf(kind);
    if (!group || !state.mail.address || !state.mail.on[group]) return null;
    var letter = composeLetter(kind, title, detail);
    state.mail.outbox.unshift(letter);
    if (state.mail.outbox.length > MAX_OUTBOX) state.mail.outbox.length = MAX_OUTBOX;
    return letter;
  }

  function outbox() { return state.mail.outbox; }
  function pendingLetters() { return state.mail.outbox.filter(function (l) { return !l.sent; }); }

  function markLetterSent(id) {
    state.mail.outbox.forEach(function (l) { if (l.id === id) l.sent = true; });
    save();
  }

  function markAllSent() {
    state.mail.outbox.forEach(function (l) { l.sent = true; });
    save();
  }

  function clearOutbox() {
    state.mail.outbox = [];
    save();
  }

  /** Everything unsent, folded into one letter. */
  function digest() {
    var pending = pendingLetters();
    if (!pending.length) return null;
    var body = pending.map(function (letter, i) {
      return (i + 1) + ". " + letter.title +
        (letter.detail ? "\n   " + letter.detail : "") +
        "\n   " + letterTime(letter.at);
    }).join("\n\n");
    return {
      count: pending.length,
      subject: "Meridian · сводка, событий: " + pending.length,
      body: body + "\n\nБаланс: " + Market.money(total(), state.settings.currency, { dp: 2 }) +
        "\n\n—\nПисьмо сформировано кошельком Meridian на вашем устройстве."
    };
  }

  /** A mailto: link — the one way to actually post a letter with no server. */
  function mailtoLink(subject, body) {
    return "mailto:" + encodeURIComponent(state.mail.address) +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
  }

  function record(tx) {
    tx.id = signature();
    tx.at = Date.now();
    tx.status = "ok";
    state.txs.unshift(tx);
    if (state.txs.length > 120) state.txs.length = 120;
    return tx;
  }

  /** Fiat -> token. `usd` is what leaves the card, fee included. */
  function buy(tokenId, usd) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!(usd > 0)) throw new Error("сумма должна быть больше нуля");
    if (usd > state.card.available + 1e-9) throw new Error("на карте недостаточно средств");

    var fee = usd * FEES.buy;
    var units = (usd - fee) / token.price;
    state.card.available -= usd;
    setBalance(tokenId, balanceOf(tokenId) + units);
    var tx = record({ kind: "buy", tokenId: tokenId, amount: units, usd: usd, fee: fee });
    notify("buy", "Куплено " + Market.amount(units, tokenId) + " " + token.sym,
           "Списано с карты •• " + state.card.last4);
    save();
    return tx;
  }

  /** Token -> fiat, paid back to the card. */
  function sell(tokenId, units) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!(units > 0)) throw new Error("количество должно быть больше нуля");
    if (units > balanceOf(tokenId) + 1e-12) throw new Error("недостаточно " + token.sym);

    var gross = units * token.price;
    var fee = gross * FEES.sell;
    setBalance(tokenId, balanceOf(tokenId) - units);
    state.card.available += gross - fee;
    var tx = record({ kind: "sell", tokenId: tokenId, amount: units, usd: gross, fee: fee });
    notify("sell", "Продано " + Market.amount(units, tokenId) + " " + token.sym,
           "На карту •• " + state.card.last4);
    save();
    return tx;
  }

  function networkFee(tokenId) {
    var token = Market.byId(tokenId);
    return NETWORK_FEE_USD / token.price;
  }

  function send(tokenId, units, address) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!addressLooksValid(address)) throw new Error("адрес выглядит неверно");
    if (address === account().address) throw new Error("это адрес этого же счёта");
    if (!(units > 0)) throw new Error("количество должно быть больше нуля");

    var fee = networkFee(tokenId);
    if (units + fee > balanceOf(tokenId) + 1e-12) throw new Error("не хватает на комиссию сети");

    setBalance(tokenId, balanceOf(tokenId) - units - fee);
    var tx = record({
      kind: "out", tokenId: tokenId, amount: units,
      usd: units * token.price, fee: fee * token.price, address: address
    });
    var known = contactFor(address);
    notify("out", "Отправлено " + Market.amount(units, tokenId) + " " + token.sym,
           known ? "Получатель: " + known.name : "На адрес " + address.slice(0, 6) + "…");
    save();
    return tx;
  }

  /* ---------- topping up ---------- */

  var CARD_LIMIT = 1000000;

  /** Puts money on the linked card, which is what buying draws from. */
  function topUpCard(usd) {
    if (!(usd > 0)) throw new Error("сумма должна быть больше нуля");
    if (state.card.available + usd > CARD_LIMIT) throw new Error("демо-карта не принимает больше миллиона");
    state.card.available += usd;
    var tx = record({ kind: "topup", tokenId: "usdc", amount: usd, usd: usd, fee: 0 });
    notify("topup", "Карта пополнена", Market.money(usd, state.settings.currency) +
      " · на карте " + Market.money(state.card.available, state.settings.currency));
    save();
    return tx;
  }

  /** An incoming transfer: in a real network it would arrive from outside. */
  function depositToken(tokenId, units, from) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!(units > 0)) throw new Error("количество должно быть больше нуля");
    setBalance(tokenId, balanceOf(tokenId) + units);
    var tx = record({
      kind: "in", tokenId: tokenId, amount: units, usd: units * token.price, fee: 0,
      address: from || Vault.base58(Vault.digest("meridian/demo/deposit/" + Date.now()))
    });
    notify("in", "Получено " + Market.amount(units, tokenId) + " " + token.sym, "Зачислено на счёт");
    save();
    return tx;
  }

  /* ---------- withdrawing to an exchange ---------- */

  /**
   * A withdrawal is an ordinary transfer with the two checks that actually
   * matter: the address has to belong to the network you picked, and some
   * networks reject a deposit that arrives without a memo.
   */
  function withdrawToExchange(tokenId, units, opts) {
    opts = opts || {};
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");

    var network = Market.networksFor(tokenId).filter(function (n) { return n.id === opts.network; })[0];
    if (!network) throw new Error("выберите сеть");

    var address = String(opts.address || "").trim();
    if (!address) throw new Error("вставьте адрес пополнения с биржи");
    if (!network.pattern.test(address))
      throw new Error("адрес не похож на адрес сети «" + network.label + "»");
    if (network.memo && !String(opts.memo || "").trim())
      throw new Error("для сети «" + network.label + "» биржа требует memo");

    if (!(units > 0)) throw new Error("количество должно быть больше нуля");
    if (units < network.min)
      throw new Error("биржа не примет меньше " + Market.amount(network.min, tokenId) + " " + token.sym);

    var fee = networkFee(tokenId);
    if (units + fee > balanceOf(tokenId) + 1e-12) throw new Error("не хватает на комиссию сети");

    setBalance(tokenId, balanceOf(tokenId) - units - fee);
    var exchange = (Market.EXCHANGES.filter(function (e) { return e.id === opts.exchange; })[0] || {}).name ||
      opts.exchangeName || "биржу";
    var tx = record({
      kind: "exchange", tokenId: tokenId, amount: units, usd: units * token.price,
      fee: fee * token.price, address: address, memo: String(opts.memo || "").trim() || null,
      exchange: exchange, network: network.label
    });
    notify("exchange", "Выведено на " + exchange,
      Market.amount(units, tokenId) + " " + token.sym + " · " + network.label);
    save();
    return tx;
  }

  function swapQuote(fromId, toId, units) {
    var from = Market.byId(fromId), to = Market.byId(toId);
    if (!from || !to || fromId === toId) return null;
    var gross = units * from.price;
    var fee = gross * FEES.swap;
    return {
      from: from, to: to, units: units,
      out: (gross - fee) / to.price,
      fee: fee,
      rate: from.price / to.price,
      impact: Math.min(0.9, (gross / 250000) * 100)
    };
  }

  function swap(fromId, toId, units) {
    var quote = swapQuote(fromId, toId, units);
    if (!quote) throw new Error("нельзя обменять токен сам на себя");
    if (!(units > 0)) throw new Error("количество должно быть больше нуля");
    if (units > balanceOf(fromId) + 1e-12) throw new Error("недостаточно " + quote.from.sym);

    setBalance(fromId, balanceOf(fromId) - units);
    setBalance(toId, balanceOf(toId) + quote.out);
    var tx = record({
      kind: "swap", tokenId: fromId, amount: units, usd: units * quote.from.price,
      fee: quote.fee, toTokenId: toId, toAmount: quote.out
    });
    notify("swap", "Обмен выполнен",
           Market.amount(units, fromId) + " " + quote.from.sym + " → " +
           Market.amount(quote.out, toId) + " " + quote.to.sym);
    save();
    return tx;
  }

  /* ---------- staking ---------- */

  /** Rewards owed on a position right now, from elapsed demo time. */
  function rewardsOf(stake) {
    var hours = ((Date.now() - stake.since) / 1000) * HOURS_PER_SECOND;
    return (stake.carried || 0) + stake.amount * (stake.apy / 100) * (hours / (24 * 365));
  }

  function stakes() { return account().stakes || []; }

  function rewardsTotal() {
    return stakes().reduce(function (sum, st) {
      return sum + rewardsOf(st) * Market.byId(st.tokenId).price;
    }, 0);
  }

  function stake(tokenId, units, validatorId) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!token.apy) throw new Error(token.sym + " не поддерживает стейкинг");
    if (!(units > 0)) throw new Error("количество должно быть больше нуля");
    if (units > balanceOf(tokenId) + 1e-12) throw new Error("недостаточно " + token.sym);

    setBalance(tokenId, balanceOf(tokenId) - units);
    var position = {
      id: signature(), tokenId: tokenId, amount: units, validator: validatorId,
      apy: Market.apyFor(tokenId, validatorId), since: Date.now(), carried: 0
    };
    account().stakes.push(position);
    var tx = record({ kind: "stake", tokenId: tokenId, amount: units, usd: units * token.price, fee: 0 });
    notify("stake", "Застейкано " + Market.amount(units, tokenId) + " " + token.sym,
           "Ставка " + position.apy.toFixed(1).replace(".", ",") + " % годовых");
    save();
    return tx;
  }

  /** Pays out rewards without touching the principal. */
  function claim(stakeId) {
    var position = stakes().filter(function (st) { return st.id === stakeId; })[0];
    if (!position) throw new Error("позиция не найдена");
    var reward = rewardsOf(position);
    /* Demo time runs fast enough that a reward is never exactly zero, so the
       bar is the token's own precision: don't spend a transaction on dust. */
    var dust = Math.pow(10, -(Market.byId(position.tokenId).dp + 2));
    if (reward < dust) throw new Error("награда пока слишком мала");

    position.carried = 0;
    position.since = Date.now();
    setBalance(position.tokenId, balanceOf(position.tokenId) + reward);
    var token = Market.byId(position.tokenId);
    var tx = record({ kind: "reward", tokenId: position.tokenId, amount: reward, usd: reward * token.price, fee: 0 });
    notify("reward", "Награда зачислена", Market.amount(reward, position.tokenId) + " " + token.sym);
    save();
    return tx;
  }

  /** Returns principal and rewards together, and closes the position. */
  function unstake(stakeId) {
    var position = stakes().filter(function (st) { return st.id === stakeId; })[0];
    if (!position) throw new Error("позиция не найдена");
    var reward = rewardsOf(position);
    var returned = position.amount + reward;

    account().stakes = stakes().filter(function (st) { return st.id !== stakeId; });
    setBalance(position.tokenId, balanceOf(position.tokenId) + returned);
    var token = Market.byId(position.tokenId);
    var tx = record({ kind: "unstake", tokenId: position.tokenId, amount: returned, usd: returned * token.price, fee: 0 });
    notify("unstake", "Выведено из стейкинга",
           Market.amount(returned, position.tokenId) + " " + token.sym + ", включая награду");
    save();
    return tx;
  }

  /* ---------- address book ---------- */

  function contacts() { return state.contacts; }

  function contactFor(address) {
    return state.contacts.filter(function (c) { return c.address === address; })[0] || null;
  }

  function addContact(name, address, note) {
    if (!String(name || "").trim()) throw new Error("нужно имя");
    /* The book also holds exchange deposit addresses, and those live on
       other networks — 0x…, T…, addr1… — so the base58 rule is too narrow. */
    if (!addressIsPlausible(address)) throw new Error("адрес выглядит неверно");
    if (contactFor(address.trim())) throw new Error("такой адрес уже сохранён");
    var contact = { id: signature(), name: String(name).trim(), address: String(address).trim(), note: String(note || "").trim() };
    state.contacts.unshift(contact);
    save();
    return contact;
  }

  function removeContact(id) {
    state.contacts = state.contacts.filter(function (c) { return c.id !== id; });
    save();
  }

  /* ---------- price alerts ---------- */

  function alerts() { return state.alerts; }

  function addAlert(tokenId, direction, price) {
    var token = Market.byId(tokenId);
    if (!token) throw new Error("нет такого токена");
    if (!(price > 0)) throw new Error("укажите цену больше нуля");
    if (direction === "above" && price <= token.price) throw new Error("цена уже выше указанной");
    if (direction === "below" && price >= token.price) throw new Error("цена уже ниже указанной");
    var alert = { id: signature(), tokenId: tokenId, direction: direction, price: price, at: Date.now() };
    state.alerts.unshift(alert);
    save();
    return alert;
  }

  function removeAlert(id) {
    state.alerts = state.alerts.filter(function (a) { return a.id !== id; });
    save();
  }

  /** Called on every market tick; returns the alerts that just tripped. */
  function checkAlerts() {
    if (!state) return [];
    var fired = state.alerts.filter(function (a) {
      var price = Market.byId(a.tokenId).price;
      return a.direction === "above" ? price >= a.price : price <= a.price;
    });
    if (!fired.length) return [];
    fired.forEach(function (a) {

  }

<script>
/**
 * The opening sequence.
 *
 * Same grammar as the reference: a wireframe tunnel in perspective, the mark
 * drawn stroke by stroke, huge type flying past the camera, a wall of panels
 * sweeping by, an RGB split on the seam. Scroll drives the camera, exactly
 * as it does there — the page is a timeline, not a slideshow.
 *
 * No libraries. Scrolling writes five progress values onto the stage as CSS
 * variables, and every layer is a transform expressed in terms of them, so
 * the whole scene animates on the compositor.
 */
(function (global) {
  "use strict";

  var UI = global.UI;
  var h = UI.h, icon = UI.icon;

  /* Where each beat lives on the scroll, 0 to 1. */
  var BEATS = {
    mark:  [0.00, 0.18],
    type:  [0.14, 0.44],
    wall:  [0.38, 0.76],
    flash: [0.74, 0.84],
    end:   [0.82, 1.00]
  };

  var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var seg = function (p, range) { return clamp01((p - range[0]) / (range[1] - range[0])); };

  function reducedMotion() {
    return typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  /* The mark, drawn rather than placed: every stroke is dashed so the scroll
     can pull it into existence. */
  var MARK = '' +
    '<svg class="intro__mark" viewBox="0 0 120 120" aria-hidden="true">' +
      '<g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">' +
        '<circle class="draw" cx="60" cy="60" r="46" pathLength="1"/>' +
        '<ellipse class="draw" cx="60" cy="60" rx="34" ry="46" pathLength="1"/>' +
        '<ellipse class="draw" cx="60" cy="60" rx="15" ry="46" pathLength="1"/>' +
        '<path class="draw" d="M14 60h92" pathLength="1"/>' +
        '<path class="draw" d="M22 38h76" pathLength="1"/>' +
        '<path class="draw" d="M22 82h76" pathLength="1"/>' +
      "</g>" +
      '<path class="draw meridian" d="M60 8v104" fill="none" stroke="#9cbbff" stroke-width="3" stroke-linecap="round" pathLength="1"/>' +
    "</svg>";

  /** Six panels flying past, carrying the product rather than placeholders. */
  var PANELS = [
    { x: -104, y: -132, tilt:  20, label: "БАЛАНС",   body: '<span class="p__big">19 606,37 $</span><span class="p__up">+2,25 %</span>' },
    { x:  108, y:  -96, tilt: -20, label: "ГРАФИК",   body: '<svg viewBox="0 0 120 46" class="p__chart"><path d="M2 38 18 30 30 34 44 18 58 24 72 10 88 16 104 6 118 12" fill="none" stroke="#24d6a0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>' },
    { x: -118, y:   34, tilt:  22, label: "КУПИТЬ",   body: '<span class="p__btn">КУПИТЬ</span>' },
    { x:  114, y:   62, tilt: -22, label: "СТЕЙКИНГ", body: '<span class="p__big">8,4 %</span><span class="p__dim">годовых</span>' },
    { x:  -96, y:  158, tilt:  18, label: "НА БИРЖУ", body: '<span class="p__mono">0x8f3A…B2c3</span><span class="p__dim">Ethereum</span>' },
    { x:  102, y: -212, tilt: -18, label: "АДРЕСА",   body: '<span class="p__mono">9ELRvD…Eey1</span><span class="p__dim">счёт № 0</span>' }
  ];

  /**
   * Builds the intro. `onDone` runs when the visitor leaves it, either by
   * scrolling to the end and choosing an action, or by skipping.
   */
  function screen(actions) {
    var stage = h("div", { class: "intro__stage" });

    /* --- the tunnel: four planes making a corridor --- */
    var tunnel = h("div", { class: "tunnel" }, ["floor", "ceil", "left", "right"].map(function (side) {
      return h("div", { class: "tunnel__plane tunnel__plane--" + side });
    }));

    /* --- beats --- */
    var mark = h("div", { class: "intro__beat intro__beat--mark", html: MARK });

    var type = h("div", { class: "intro__beat intro__beat--type" }, [
      h("span", { class: "intro__word intro__word--ghost", text: "MERIDIAN" }),
      h("span", { class: "intro__word intro__word--solid", text: "MERIDIAN" }),
      h("span", { class: "intro__word intro__word--echo", text: "MERIDIAN" })
    ]);

    var wall = h("div", { class: "intro__beat intro__beat--wall" }, PANELS.map(function (panel, i) {
      var node = h("div", {
        class: "panel",
        html: '<span class="p__label">' + panel.label + "</span>" +
              '<span class="p__body">' + panel.body + "</span>"
      });
      node.style.setProperty("--x", panel.x + "px");
      node.style.setProperty("--y", panel.y + "px");
      node.style.setProperty("--tilt", panel.tilt);
      node.style.setProperty("--i", i);
      return node;
    }));

    var scene = h("div", { class: "intro__scene" }, [tunnel, mark, type, wall]);
    var glow = h("div", { class: "intro__glow" });
    var flash = h("div", { class: "intro__flash", "data-text": "MERIDIAN" });

    stage.appendChild(glow);
    stage.appendChild(scene);
    stage.appendChild(flash);

    /* --- the end card, and the scroller that drives everything --- */
    var end = h("div", { class: "intro__end" }, [
      h("div", { class: "intro__title", text: "Meridian" }),
      h("div", { class: "intro__sub", text: "Кошелёк с большими кнопками «Купить» и «Продать». Симулятор: настоящих денег и настоящей сети здесь нет." }),
      h("div", { class: "intro__actions" }, [
        h("button", {
          class: "btn btn--primary", html: icon("plus") + "<span>Создать кошелёк</span>",
          onclick: actions.create
        }),
        h("button", {
          class: "btn btn--ghost", html: icon("key") + "<span>У меня уже есть фраза</span>",
          onclick: actions.restore
        })
      ])
    ]);

    var cue = h("div", { class: "intro__cue", html: icon("chevron-down") + "<span>листайте</span>" });

    var scroller = h("div", { class: "scroll intro__scroll" }, [
      h("div", { class: "intro__runway" }),
      end
    ]);

    var skip = h("button", {
      class: "intro__skip", text: "Пропустить",
      onclick: function () { finish(); }
    });

    var root = h("div", { class: "screen intro" }, [stage, scroller, cue, skip]);

    /* --- driving it --- */
    function paint() {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var p = max > 0 ? clamp01(scroller.scrollTop / max) : 1;
      stage.style.setProperty("--p", p.toFixed(4));
      stage.style.setProperty("--mark", seg(p, BEATS.mark).toFixed(4));
      stage.style.setProperty("--type", seg(p, BEATS.type).toFixed(4));
      stage.style.setProperty("--wall", seg(p, BEATS.wall).toFixed(4));
      stage.style.setProperty("--flash", seg(p, BEATS.flash).toFixed(4));
      stage.style.setProperty("--end", seg(p, BEATS.end).toFixed(4));
      cue.style.opacity = p > 0.04 ? "0" : "";
      skip.style.opacity = p > 0.9 ? "0" : "";
      skip.style.pointerEvents = p > 0.9 ? "none" : "";
    }

    var ticking = false;
    scroller.addEventListener("scroll", function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { paint(); ticking = false; });
    }, { passive: true });

    function finish() {
      scroller.scrollTo({ top: scroller.scrollHeight, behavior: reducedMotion() ? "auto" : "smooth" });
    }

    /* Nobody should have to scroll through a title sequence to reach a
       wallet they have already seen — or at all, if motion is unwelcome. */
    if (reducedMotion() || actions.instant) {
      root.classList.add("intro--still");
      setTimeout(function () { scroller.scrollTop = scroller.scrollHeight; paint(); }, 0);
    } else {
      setTimeout(paint, 0);
    }

    root.__tick = null;
    return root;
  }

  global.Intro = { screen: screen, BEATS: BEATS };
})(typeof window !== "undefined" ? window : globalThis);

</script>
